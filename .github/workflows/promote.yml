name: Auto Promotion

on:
  workflow_dispatch:
    inputs:
      platform:
        description: 'Platform to promote'
        required: false
        default: 'all'
        type: choice
        options:
          - all
          - twitter
          - devto

permissions:
  contents: read
  issues: write

jobs:
  promote:
    name: Generate Promotion Content
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Get release info
        id: release
        uses: actions/github-script@v9
        with:
          script: |
            let release;
            try {
              const { data } = await github.rest.repos.getLatestRelease({
                owner: context.repo.owner,
                repo: context.repo.repo
              });
              release = data;
            } catch (error) {
              if (error.status === 404) {
                core.setFailed('No published release is available for promotion.');
                return;
              }
              throw error;
            }

            if (release.draft || release.prerelease) {
              core.setFailed('The latest release is not a published stable release.');
              return;
            }

            return {
              version: release.tag_name,
              body: release.body,
              url: release.html_url
            };

      - name: Generate social media posts
        id: posts
        run: |
          VERSION="${{ fromJSON(steps.release.outputs.result).version }}"
          URL="${{ fromJSON(steps.release.outputs.result).url }}"

          TWITTER="MindNotes Pro ${VERSION} is available: a local-first whiteboard with editable templates, portable exports, and no account or cloud workspace. Try it: https://11suixing11.github.io/mindnotes-pro/ Source: https://github.com/11suixing11/mindnotes-pro #opensource #react #typescript #webdev"

          DEVTO_TITLE="What is New in MindNotes Pro ${VERSION}"
          DEVTO_TAGS="webdev, react, typescript, opensource, release"

          {
            echo "twitter<<EOF"
            echo "$TWITTER"
            echo "EOF"
            echo "devto_title=$DEVTO_TITLE"
            echo "devto_tags=$DEVTO_TAGS"
          } >> "$GITHUB_OUTPUT"

      - name: Create promotion issue
        uses: actions/github-script@v9
        with:
          script: |
            const version = '${{ fromJSON(steps.release.outputs.result).version }}';
            const twitter = `${{ steps.posts.outputs.twitter }}`;

            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Promotion Checklist for ${version}`,
              body: `## Release ${version} Promotion Checklist

            ### Social Media Posts

            #### Twitter/X
            ${twitter}

            #### Hacker News
            - Submit Show HN

            #### Reddit
            - r/webdev
            - r/opensource
            - r/reactjs

            #### Chinese Platforms
            - V2EX
            - Jike
            - Juejin
            - Zhihu

            #### Dev.to
            - Publish release article

            ### Awesome Lists
            - awesome-react PR
            - awesome-typescript PR
            - awesome-selfhosted PR

            ---
            Auto-generated by promotion workflow
            `,
              labels: ['promotion', 'release']
            });
