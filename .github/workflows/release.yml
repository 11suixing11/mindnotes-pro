name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

env:
  RELEASE_TAG: ${{ github.ref_name }}

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22.22.2
          cache: npm

      - name: Validate release tag
        run: |
          set -euo pipefail
          if [[ ! "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-(0|[1-9][0-9]*|[0-9]*[A-Za-z-][0-9A-Za-z-]*)(\.(0|[1-9][0-9]*|[0-9]*[A-Za-z-][0-9A-Za-z-]*))*)?$ ]]; then
            echo "Invalid release tag: $RELEASE_TAG" >&2
            echo "Expected vX.Y.Z or a SemVer prerelease such as vX.Y.Z-rc.1" >&2
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm run test:run

      - name: Run ESLint
        run: npm run lint

      - name: Build web and Linux desktop packages
        run: npm run build:desktop -- --publish never

      - name: Normalize Linux package name
        run: |
          set -euo pipefail
          APPIMAGE_PATH=$(find release -maxdepth 1 -type f -name '*.AppImage' -print -quit)

          if [ -z "$APPIMAGE_PATH" ]; then
            echo "No AppImage was produced" >&2
            exit 1
          fi

          mv "$APPIMAGE_PATH" "release/mindnotes-pro-${RELEASE_TAG}.AppImage"

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
          retention-days: 1

      - name: Upload Linux package
        uses: actions/upload-artifact@v7
        with:
          name: linux-package
          path: release/*.AppImage
          retention-days: 1

  release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22.22.2

      - name: Download build artifact
        uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/

      - name: Download Linux package
        uses: actions/download-artifact@v8
        with:
          name: linux-package
          path: release/

      - name: Validate release metadata
        run: |
          set -euo pipefail
          if [[ ! "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-(0|[1-9][0-9]*|[0-9]*[A-Za-z-][0-9A-Za-z-]*)(\.(0|[1-9][0-9]*|[0-9]*[A-Za-z-][0-9A-Za-z-]*))*)?$ ]]; then
            echo "Invalid release tag: $RELEASE_TAG" >&2
            echo "Expected vX.Y.Z or a SemVer prerelease such as vX.Y.Z-rc.1" >&2
            exit 1
          fi

          TAG_VERSION="${RELEASE_TAG#v}"
          TAG_BASE_VERSION="${TAG_VERSION%%-*}"
          PACKAGE_VERSION="$(node -p "require('./package.json').version")"
          PACKAGE_BASE_VERSION="${PACKAGE_VERSION%%-*}"

          if [[ "$PACKAGE_BASE_VERSION" != "$TAG_BASE_VERSION" ]]; then
            echo "package.json version ($PACKAGE_VERSION) does not match release tag base version ($TAG_BASE_VERSION)" >&2
            exit 1
          fi

          if ! grep -Eq "^## \\[${TAG_BASE_VERSION}\\]([[:space:]]|$)" CHANGELOG.md; then
            echo "CHANGELOG.md has no section for version ${TAG_BASE_VERSION}" >&2
            exit 1
          fi

      - name: Package dist archive
        run: tar -czf "mindnotes-pro-${RELEASE_TAG}.tar.gz" -C dist .

      - name: Generate checksums
        run: |
          set -euo pipefail
          ARCHIVE="mindnotes-pro-${RELEASE_TAG}.tar.gz"
          APPIMAGE_PATH=$(find release -maxdepth 1 -type f -name '*.AppImage' -print -quit)

          if [ -z "$APPIMAGE_PATH" ]; then
            echo "No AppImage was produced" >&2
            exit 1
          fi

          ARCHIVE_HASH=$(sha256sum "$ARCHIVE" | awk '{print $1}')
          APPIMAGE_NAME=$(basename "$APPIMAGE_PATH")
          APPIMAGE_HASH=$(sha256sum "$APPIMAGE_PATH" | awk '{print $1}')
          printf '%s  %s\n' "$ARCHIVE_HASH" "$ARCHIVE" > SHA256SUMS
          printf '%s  %s\n' "$APPIMAGE_HASH" "$APPIMAGE_NAME" >> SHA256SUMS

          VERIFY_DIR=$(mktemp -d)
          cp "$ARCHIVE" "$APPIMAGE_PATH" SHA256SUMS "$VERIFY_DIR"/
          (cd "$VERIFY_DIR" && sha256sum -c SHA256SUMS)

      - name: Extract release notes from CHANGELOG
        id: changelog
        run: |
          VERSION_NUM="${RELEASE_TAG#v}"
          VERSION_BASE="${VERSION_NUM%%-*}"

          # Extract the section for this version from CHANGELOG.md
          NOTES=$(awk -v ver="$VERSION_BASE" '
            /^## \[/ {
              if (found) exit
              gsub(/[\[\]]/, "")
              if ($2 ~ "^"ver) found=1; next
            }
            found { print }
          ' CHANGELOG.md)

          if [ -z "$NOTES" ]; then
            NOTES=$(git log "${RELEASE_TAG}~1..${RELEASE_TAG}" --pretty=format:"- %s" --no-merges 2>/dev/null || echo "See CHANGELOG for details.")
          fi

          {
            echo "body<<EOF"
            echo "$NOTES"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          body: |
            ## What's New in ${{ env.RELEASE_TAG }}

            ${{ steps.changelog.outputs.body }}

            ---

            **Install**

            Download the attached Linux AppImage:

            ```bash
            chmod +x ./*.AppImage
            ./*.AppImage
            ```

            The `mindnotes-pro-${{ env.RELEASE_TAG }}.tar.gz` archive contains the production web build for static hosting. You can also use the **[Live App](https://11suixing11.github.io/mindnotes-pro)**.

            **Before upgrading**

            Export a JSON backup before clearing browser site data or changing devices. Browser documents remain local to the current origin. The previous v4 document store is imported read-only on first v5 startup when available; the original database is never deleted. If automatic migration cannot occur, export the old data as JSON when possible and use the supported import path; imports replace the current board after validation.

            **[Full Changelog](https://github.com/${{ github.repository }}/blob/main/CHANGELOG.md)** · **[Report Issues](https://github.com/${{ github.repository }}/issues)**
          files: |
            mindnotes-pro-${{ env.RELEASE_TAG }}.tar.gz
            release/*.AppImage
            SHA256SUMS
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(env.RELEASE_TAG, '-') }}
