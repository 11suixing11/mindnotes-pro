name: Close Stale Issues and PRs

on:
  schedule:
    - cron: '30 1 * * *'
  workflow_dispatch:

permissions:
  issues: write
  pull-requests: write

jobs:
  stale:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/stale@v11
        with:
          stale-issue-message: >
            This issue has been automatically marked as stale because it has not
            had recent activity. It will be closed in 30 days if no further
            activity occurs. Thank you for your contributions.
          stale-pr-message: >
            This pull request has been automatically marked as stale because it
            has not had recent activity. It will be closed in 30 days if no
            further activity occurs. Thank you for your contributions.
          close-issue-message: >
            This issue was closed because it has been stale for 30 days with no
            activity. Feel free to reopen if it is still relevant.
          close-pr-message: >
            This pull request was closed because it has been stale for 30 days
            with no activity. Feel free to reopen if it is still relevant.
          days-before-stale: 90
          days-before-close: 30
          stale-issue-label: stale
          stale-pr-label: stale
          exempt-all-milestones: true
          exempt-issue-labels: pinned,security,data-loss,long-term,roadmap
          exempt-pr-labels: pinned,security,release-blocker,long-term,roadmap
